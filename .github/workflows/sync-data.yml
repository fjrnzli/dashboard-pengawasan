name: Sync Google Sheets Data

on:
  schedule:
    # Berjalan otomatis setiap 1 jam
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Sync data from Google Sheets
        run: |
          python3 << 'PYEOF'
          import urllib.request, openpyxl, io, json, os
          from datetime import datetime, date, timedelta
          from collections import Counter

          GSHEET_ID = '2PACX-1vTswl_KO5Flwh1dMg8RJv8wbJnXAmJ13yei15FV8NmiO9O4Rt9RGGcfTFeK9HoynQ'
          GSHEET_URL = f'https://docs.google.com/spreadsheets/d/e/{GSHEET_ID}/pub?output=xlsx'

          BULAN_INDONESIA = {
              1:'Januari',2:'Februari',3:'Maret',4:'April',5:'Mei',6:'Juni',
              7:'Juli',8:'Agustus',9:'September',10:'Oktober',11:'November',12:'Desember'
          }
          BULAN_KE_ANGKA = {v.lower(): k for k, v in BULAN_INDONESIA.items()}
          BULAN_ENGLISH = {
              'january':1,'february':2,'march':3,'april':4,'may':5,'june':6,
              'july':7,'august':8,'september':9,'october':10,'november':11,'december':12
          }

          def clean_str(val):
              if val is None: return ''
              return str(val).strip()

          def parse_tanggal(value):
              if value is None: return None
              if isinstance(value, datetime): return value.date()
              if isinstance(value, date): return value
              s = str(value).strip()
              if not s or s.lower() in ('none','nan',''): return None
              parts = s.split()
              if len(parts) == 3:
                  try:
                      d, m, y = int(parts[0]), parts[1].lower(), int(parts[2])
                      if m in BULAN_KE_ANGKA: return date(y, BULAN_KE_ANGKA[m], d)
                      if m in BULAN_ENGLISH: return date(y, BULAN_ENGLISH[m], d)
                  except: pass
              for fmt in ('%Y-%m-%d %H:%M:%S','%Y-%m-%d','%d/%m/%Y','%d-%m-%Y'):
                  try: return datetime.strptime(s[:len(fmt)], fmt).date()
                  except: pass
              try:
                  serial = float(s)
                  if 1 < serial < 200000: return (date(1899,12,30) + timedelta(days=int(serial)))
              except: pass
              return None

          print(f'Downloading from: {GSHEET_URL}')
          req = urllib.request.Request(GSHEET_URL, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read()
          print(f'Downloaded {len(raw)//1024} KB')

          wb = openpyxl.load_workbook(io.BytesIO(raw), data_only=True)
          sheet = wb['DATA']
          headers = [clean_str(c.value) for c in sheet[1]]
          col = {h: i for i, h in enumerate(headers) if h}

          kegiatan = []
          for row_cells in sheet.iter_rows(min_row=2, values_only=False):
              row = {name: (row_cells[idx].value if idx < len(row_cells) else None) for name, idx in col.items()}
              vals = [v for v in row.values() if v is not None]
              if not vals: continue
              no_str = clean_str(row.get('No','')).replace('.0','').strip()
              nama_keg = clean_str(row.get('Nama Bank / Kegiatan Pengawasan'))
              nama_pujk = clean_str(row.get('Nama PUJK'))
              kota = clean_str(row.get('Kota/Kab'))
              tgl_mulai = parse_tanggal(row.get('Tanggal Mulai'))
              tgl_selesai = parse_tanggal(row.get('Tanggal Selesai ') or row.get('Tanggal Selesai'))
              anggota = [clean_str(row.get(k)) for k in ['Anggota 1','Anggota 2','Anggota 3','Anggota 4'] if clean_str(row.get(k))]
              bulan = BULAN_INDONESIA.get(tgl_mulai.month, '') if tgl_mulai else ''
              kuartal_raw = clean_str(row.get('Kuartal (Q)'))
              if not kuartal_raw and tgl_mulai:
                  q = (tgl_mulai.month - 1) // 3 + 1
                  kuartal_raw = f'Q{q}'
              bidang_raw = clean_str(row.get('Bidang') or row.get('Sektor'))
              status_raw = clean_str(row.get('Status Kegiatan'))
              if not nama_keg: continue
              kegiatan.append({
                  'no': no_str, 'namaKegiatan': nama_keg, 'namaPUJK': nama_pujk,
                  'kotaKab': kota, 'bidang': bidang_raw,
                  'jenisLJK': clean_str(row.get('Jenis LJK')),
                  'jenisKegiatan': clean_str(row.get('Jenis Kegiatan')),
                  'kuartal': kuartal_raw, 'bulan': bulan,
                  'tanggalMulai': tgl_mulai.isoformat() if tgl_mulai else None,
                  'tanggalSelesai': tgl_selesai.isoformat() if tgl_selesai else None,
                  'supervisor': clean_str(row.get('Supervisor')),
                  'anggota': anggota, 'statusKegiatan': status_raw, 'dateWarning': False
              })

          counter = Counter(k['namaPUJK'] for k in kegiatan if k['namaPUJK'])
          lookup = {}
          for k in kegiatan:
              if k['namaPUJK'] and k['namaPUJK'] not in lookup:
                  lookup[k['namaPUJK']] = {'jenisLJK': k['jenisLJK'], 'bidang': k['bidang']}
          top10 = [{'nama': n, 'jumlah': c, 'jenisLJK': lookup.get(n,{}).get('jenisLJK',''), 'bidang': lookup.get(n,{}).get('bidang','')} for n, c in counter.most_common(10)]

          output = {
              'kegiatan': kegiatan, 'hariLibur': [], 'topPUJK': top10,
              'metadata': {
                  'totalKegiatan': len(kegiatan),
                  'tanggalGenerate': datetime.utcnow().isoformat() + 'Z',
                  'sumber': GSHEET_URL
              }
          }
          os.makedirs('data', exist_ok=True)
          with open('data/data.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          print(f'Synced {len(kegiatan)} kegiatan to data/data.json')
          PYEOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Auto-sync data from Google Sheets [skip ci]"
          git push
